name: 'Selectify'
type: module
description: 'Modern, accessible select and radio/checkbox components for Drupal forms (Views, Field UI, Form API, Webform). Five dropdown widgets, RTL/LTR support, WCAG 2.1 AA.'
package: 'User interface'
core_version_requirement: ^10 || ^11 || ^12
dependencies:
  - drupal:views
  - drupal:field
configure: selectify.settings_form
