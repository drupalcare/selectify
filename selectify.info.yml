name: 'Selectify'
type: module
description: 'Replaces select lists, radio buttons and checkboxes with accessible styled widgets in Views, Field UI, Form API and Webform forms, with five dropdown styles and right-to-left support.'
package: 'User interface'
core_version_requirement: ^10 || ^11 || ^12
dependencies:
  - drupal:views
  - drupal:field
configure: selectify.settings_form
