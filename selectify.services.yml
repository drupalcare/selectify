services:
  selectify.twig_extension:
    class: Drupal\selectify\TwigExtension\SelectifyTwigExtension
    tags:
      - { name: twig.extension }

  selectify.style_service:
    class: Drupal\selectify\Service\SelectifyStyleService
    arguments: ['@config.factory']

  selectify.helper:
    class: Drupal\selectify\Service\SelectifyHelper
    arguments:
      - '@config.factory'
      - '@router.admin_context'
      - '@theme.manager'
      - '@theme_handler'
      - '@path.matcher'
      - '@path.current'
      - '@path_alias.manager'
      - '@current_route_match'
