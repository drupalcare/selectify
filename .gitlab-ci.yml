################
# GitLabCI template for Drupal projects.
#
# This template is designed to give any Contrib maintainer everything they need to test, without requiring modification.
# It is also designed to keep up to date with Core Development automatically through the use of include files that can be centrally maintained.
# As long as you include the project, ref and three files below, any future updates added by the Drupal Association will be used in your
# pipelines automatically. However, you can modify this template if you have additional needs for your project.
# The full documentation is on https://project.pages.drupalcode.org/gitlab_templates/
################

# For information on alternative values for 'ref' see https://project.pages.drupalcode.org/gitlab_templates/info/templates-version/
# To test a Drupal 7 project, change the first include filename from .main.yml to .main-d7.yml
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

################
# Variables
# https://git.drupalcode.org/project/gitlab_templates/-/blob/main/includes/include.drupalci.variables.yml
################
variables:
  # info.yml claims `^10 || ^11 || ^12`, so all three ends get a job.
  #
  # TWO SWITCHES ARE NEEDED PER VARIANT, NOT ONE. `OPT_IN_TEST_*` (default '0')
  # creates the job; `_AUTORUN_*` (default 'none') decides whether it runs or
  # sits behind a manual prerequisite. The previous-major opt-in below was here
  # already WITHOUT its autorun, so that job had never actually run — a green
  # pipeline with no coverage, which is worse than a missing job because it
  # looks fine. This is the same omission that let cloudflare_purge 3.1.2 ship
  # a class fatal to autoload on Drupal 10 (#3614126).
  OPT_IN_TEST_PREVIOUS_MAJOR: '1'
  _AUTORUN_PREVIOUS_MAJOR: 'all'
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MINOR: 'all'
  # Drupal 12. Nothing had ever loaded this module on 12 before this line.
  OPT_IN_TEST_NEXT_MAJOR: '1'
  _AUTORUN_NEXT_MAJOR: 'all'
  # The three lines that stood here were `_SKIP_PHPSTAN`, `_SKIP_ESLINT` and
  # `_SKIP_STYLELINT`. THE TEMPLATE DEFINES NO SUCH VARIABLES — the real names
  # have no leading underscore (verified against
  # gitlab_templates/includes/include.drupalci.variables.yml). All three were
  # inert. They were set to "0", which is also the default, so nothing changed
  # behaviour; they are dropped rather than corrected because setting a
  # variable to its own default only invites the reader to think it matters.

################
# Custom Jobs (Optional)
# Add any custom testing jobs below if needed
################
